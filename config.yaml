# OFDM系统配置参数
n_fft: 2048
cp_len: 144
mod_order: 6  # QPSK/16QAM/64QAM
num_symbols: 14
snr_db: 20
n_subcarrier: 312
num_tx_ant: 1
num_rx_ant: 2
code_rate: 1 # 1 for no FEC, float for FEC
pilot_pattern: comb
pilot_spacing: 2
pilot_symbols: [2,11]
freq_offset: 0.02
timing_offset: 72
est_time: fft_ml  #fft_ml/diff_phase/ml_then_phase
channel_type: multipath  #awgn/multipath/rayleigh/sionna_fading/sionna_tdl
display_est_result: False  # 是否显示估计结果
interp_method: linear  # linear or nearest
equ_method: mrc  # zf/mmse/mrc/irc
win_size: [2,2,2]  # QPSK窗口大小（用于信道估计）
eval_method: nnrx    #nnrx/legacy
